<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>StreamVault · Netflix Clone</title>

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<style>
:root{
  --bg:#141414; --panel:#181818; --card:#1f1f1f; --red:#e50914;
  --text:#e5e5e5; --dim:#8c8c8c; --green:#46d369; --amber:#f5a623;
  --border:#2a2a2a;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;}
body{background:var(--bg);color:var(--text);overflow-x:hidden;}

/* NAVBAR */
.navbar{position:fixed;top:0;left:0;right:0;height:68px;padding:0 4%;display:flex;align-items:center;gap:28px;z-index:100;
  background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);transition:background .3s;}
.navbar.scrolled{background:var(--bg);}
.logo{font-size:26px;font-weight:900;color:var(--red);letter-spacing:-1px;cursor:pointer;white-space:nowrap;}
.logo span{color:#fff;font-weight:300;}
.nav-links{display:flex;gap:20px;font-size:14px;}
.nav-links span{cursor:pointer;transition:color .2s;}
.nav-links span:hover{color:#b3b3b3;}
.nav-links span.active{font-weight:700;color:#fff;}
.search-box{margin-left:auto;display:flex;gap:8px;}
.search-box input{background:rgba(0,0,0,.75);border:1px solid #444;border-radius:4px;padding:8px 14px;color:#fff;font-size:14px;width:240px;outline:none;transition:border .2s,width .2s;}
.search-box input:focus{border-color:var(--red);width:280px;}
.search-box button{background:var(--red);border:none;border-radius:4px;padding:8px 18px;color:#fff;font-weight:600;cursor:pointer;font-size:14px;min-width:80px;}
.search-box button:hover{background:#b2070f;}
.search-box button:disabled{opacity:.6;cursor:wait;}

/* HOME HERO */
.hero{position:relative;height:56vw;max-height:80vh;min-height:360px;background:#000;display:flex;align-items:flex-end;}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;opacity:.45;transition:background-image .5s;}
.hero-grad{position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,rgba(20,20,20,.4) 40%,transparent 70%);}
.hero-content{position:relative;z-index:2;padding:0 4% 60px;max-width:640px;}
.hero-content h1{font-size:clamp(28px,4vw,56px);font-weight:900;line-height:1.1;margin-bottom:16px;text-shadow:2px 2px 8px #000;}
.hero-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:#bcbcbc;margin-bottom:16px;}
.match{color:var(--green);font-weight:700;}
.hero-desc{font-size:clamp(13px,1.4vw,17px);color:#d2d2d2;line-height:1.5;margin-bottom:24px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap;}
.btn-play{background:#fff;color:#000;border:none;border-radius:4px;padding:12px 28px;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;}
.btn-play:hover{opacity:.8;}
.btn-info{background:rgba(109,109,110,.7);color:#fff;border:none;border-radius:4px;padding:12px 28px;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;}
.btn-info:hover{background:rgba(109,109,110,.5);}

/* HOME ROWS */
.rows{padding:0 0 40px;margin-top:-60px;position:relative;z-index:3;}
.row{padding:0 4%;margin-bottom:32px;}
.row h2{font-size:clamp(16px,1.6vw,22px);font-weight:700;margin-bottom:12px;}
.row-inner{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;padding-bottom:8px;scrollbar-width:none;}
.row-inner::-webkit-scrollbar{display:none;}

/* CARD */
.card{position:relative;border-radius:4px;overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s;background:var(--card);}
.row-inner .card{flex:0 0 200px;}
.card:hover{transform:scale(1.06);z-index:2;box-shadow:0 8px 24px #000;}
.card img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;background:#222;}
.card .card-title{font-size:12px;padding:8px 6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .card-meta{font-size:11px;color:var(--dim);padding:0 6px 8px;display:flex;justify-content:space-between;}
.card .quality-tag{position:absolute;top:6px;right:6px;background:var(--red);font-size:10px;font-weight:700;padding:2px 6px;border-radius:2px;}

/* SEARCH GRID */
.search-header{padding:24px 4% 8px;display:flex;align-items:baseline;gap:16px;}
.search-header h2{font-size:clamp(18px,2vw,26px);font-weight:700;}
.search-header .count{color:var(--dim);font-size:14px;}
.search-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:24px 4% 40px;}

/* ================= DETAIL MODAL (NETFLIX STYLE) ================= */
.detail-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:200;overflow-y:auto;}
.detail-modal.open{display:block;}
.detail-close{position:fixed;top:16px;right:4%;width:44px;height:44px;background:rgba(0,0,0,.7);border:none;border-radius:50%;font-size:28px;color:#fff;cursor:pointer;z-index:220;display:flex;align-items:center;justify-content:center;}
.detail-close:hover{background:var(--red);}

/* Detail Hero */
.detail-hero{position:relative;min-height:460px;background:center 20%/cover no-repeat #0a0a0a;display:flex;align-items:flex-end;}
.detail-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,rgba(20,20,20,.6) 45%,rgba(20,20,20,.1) 100%);z-index:1;}
.detail-hero-inner{position:relative;z-index:2;padding:40px 4% 30px;display:flex;gap:28px;align-items:flex-end;width:100%;max-width:1400px;margin:0 auto;}
.detail-poster{width:180px;flex-shrink:0;border-radius:10px;box-shadow:0 12px 32px #000;aspect-ratio:2/3;object-fit:cover;background:#222;}
.detail-info{flex:1;min-width:0;}
.detail-info h1{font-size:clamp(28px,3.6vw,52px);font-weight:900;line-height:1.05;margin-bottom:12px;text-shadow:2px 2px 10px #000;}
.detail-badges{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:#ccc;margin-bottom:14px;}
.detail-badges .rating{color:var(--green);font-weight:700;}
.detail-badges .pill{border:1px solid #555;border-radius:14px;padding:3px 12px;font-size:12px;}
.detail-badges .divider{color:#555;}
.detail-overview{font-size:14px;line-height:1.6;color:#d2d2d2;max-width:720px;margin-bottom:18px;}
.detail-actions{display:flex;gap:12px;flex-wrap:wrap;}

/* Sticky pill nav */
.pill-nav{position:sticky;top:0;z-index:50;background:rgba(20,20,20,.95);backdrop-filter:blur(12px);padding:14px 4%;display:flex;gap:8px;border-bottom:1px solid var(--border);}
.pill-nav button{background:transparent;border:1px solid #444;border-radius:20px;padding:8px 20px;color:#bbb;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.pill-nav button:hover{border-color:#888;color:#fff;}
.pill-nav button.active{background:#fff;color:#000;border-color:#fff;}

/* Detail Body */
.detail-body{max-width:1400px;margin:0 auto;padding:24px 4% 60px;}

/* Section */
.d-section{margin-bottom:32px;}
.d-section-title{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:#aaa;font-weight:700;margin-bottom:12px;}

/* Cast */
.cast-row{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;}
.cast-row::-webkit-scrollbar{display:none;}
.cast-card{flex:0 0 100px;text-align:center;}
.cast-card img{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#222;margin:0 auto 6px;display:block;}
.cast-name{font-size:12px;font-weight:600;line-height:1.3;}
.cast-role{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.3;}

/* Season / Episode */
.season-controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.season-controls select{background:#2a2a2a;border:1px solid #444;border-radius:8px;padding:10px 16px;color:#fff;font-size:14px;cursor:pointer;outline:none;min-width:180px;}
.season-controls select:focus{border-color:var(--red);}
.episode-list{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding-right:6px;}
.episode-list::-webkit-scrollbar{width:6px;}
.episode-list::-webkit-scrollbar-thumb{background:#333;border-radius:3px;}
.episode-item{display:flex;gap:14px;padding:10px;border-radius:8px;cursor:pointer;transition:background .2s;align-items:center;background:transparent;border:1px solid transparent;}
.episode-item:hover{background:#1f1f1f;}
.episode-item.active{background:#222;border-color:var(--red);}
.episode-thumb{width:140px;flex-shrink:0;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#222;}
.episode-info{flex:1;min-width:0;}
.episode-info .ep-title{font-size:14px;font-weight:600;margin-bottom:4px;}
.episode-info .ep-meta{font-size:11px;color:var(--dim);margin-bottom:4px;}
.episode-info .ep-overview{font-size:12px;color:#bbb;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.episode-num{font-size:18px;font-weight:800;color:#555;width:30px;text-align:center;flex-shrink:0;}

/* Sources */
.source-tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.source-tabs button{background:#2a2a2a;border:1px solid #444;border-radius:20px;padding:7px 16px;color:#aaa;font-size:12px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.source-tabs button.active{background:var(--red);border-color:var(--red);color:#fff;font-weight:600;}
.source-tabs button.loading{border-color:var(--amber);color:var(--amber);}
.source-tabs button.loading::after{content:'';display:inline-block;width:10px;height:10px;margin-left:6px;border:2px solid transparent;border-top-color:var(--amber);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;}
.source-tabs button.failed{opacity:.4;text-decoration:line-through;}
.source-tabs .retry-btn{background:var(--green);color:#000;border:none;border-radius:20px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;display:none;}
.source-tabs .retry-btn.show{display:inline-block;}
.source-tier-label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;margin:8px 0 4px;}

/* Player */
.player-shell{width:100%;max-width:1100px;margin:0 auto;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 20px 60px #000;position:relative;}
.player-shell .plyr{--plyr-color-main:var(--red);}
.player-status{color:#888;font-size:14px;text-align:center;padding:40px 16px;line-height:1.6;}
#embedFrame{width:100%;aspect-ratio:16/9;border:0;display:none;background:#000;}

/* Similar */
.similar-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;}
.similar-row::-webkit-scrollbar{display:none;}

/* Utility */
.section-status{padding:40px 4%;text-align:center;color:#888;font-size:15px;}
.spinner{width:28px;height:28px;border:3px solid #333;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.footer{padding:40px 4% 30px;color:#555;font-size:12px;text-align:center;border-top:1px solid #222;}
.footer a{color:#777;text-decoration:none;}
.footer a:hover{color:var(--red);}

/* Responsive */
@media(max-width:768px){
  .navbar{height:56px;gap:14px;}
  .nav-links{display:none;}
  .search-box input{width:150px;}
  .search-box input:focus{width:180px;}
  .hero{height:70vw;min-height:300px;}
  .hero-content{padding-bottom:30px;}
  .row-inner .card{flex:0 0 130px;}
  .search-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
  .btn-play,.btn-info{padding:9px 18px;font-size:14px;}
  .rows{margin-top:-30px;}
  .detail-hero{min-height:0;}
  .detail-hero-inner{padding:20px 16px;gap:14px;flex-direction:column;align-items:flex-start;}
  .detail-poster{width:120px;}
  .detail-info h1{font-size:24px;}
  .detail-overview{font-size:13px;}
  .episode-thumb{width:100px;}
  .cast-card{flex:0 0 80px;}
  .cast-card img{width:60px;height:60px;}
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar" id="navbar">
  <div class="logo" onclick="location.reload()">STREAM<span>VAULT</span></div>
  <div class="nav-links">
    <span class="active">Home</span><span>TV Shows</span><span>Movies</span><span>New & Popular</span>
  </div>
  <div class="search-box">
    <input id="searchInput" placeholder="Search movies, shows..." autocomplete="off">
    <button id="searchBtn">Search</button>
  </div>
</nav>

<!-- HOME HERO -->
<header class="hero" id="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-grad"></div>
  <div class="hero-content">
    <h1 id="heroTitle">Welcome to StreamVault</h1>
    <div class="hero-meta" id="heroMeta"><span class="match">—</span><span>—</span><span>HD</span></div>
    <p class="hero-desc" id="heroDesc">Loading featured content...</p>
    <div class="hero-btns">
      <button class="btn-play" id="heroPlayBtn">▶ Play</button>
      <button class="btn-info" id="heroInfoBtn">ℹ More Info</button>
    </div>
  </div>
</header>

<!-- HOME ROWS -->
<main class="rows" id="contentRows"></main>

<!-- ================= DETAIL MODAL ================= -->
<div class="detail-modal" id="detailModal">
  <button class="detail-close" id="detailClose">&times;</button>

  <div class="detail-hero" id="detailHero">
    <div class="detail-hero-inner">
      <img class="detail-poster" id="detailPoster" alt="Poster">
      <div class="detail-info">
        <h1 id="detailTitle">—</h1>
        <div class="detail-badges" id="detailBadges"></div>
        <p class="detail-overview" id="detailOverview"></p>
        <div class="detail-actions">
          <button class="btn-play" id="detailPlayBtn">▶ Play</button>
          <button class="btn-info" id="detailInfoBtn">ℹ More Info</button>
        </div>
      </div>
    </div>
  </div>

  <div class="pill-nav" id="pillNav">
    <button data-tab="episodes" class="active">Episodes</button>
    <button data-tab="cast">Cast</button>
    <button data-tab="similar">More Like This</button>
    <button data-tab="sources">Sources</button>
  </div>

  <div class="detail-body">
    <!-- Episodes (TV only) -->
    <div class="d-section" id="episodesSection" style="display:none;">
      <div class="d-section-title">Episodes</div>
      <div class="season-controls">
        <select id="seasonSelect"></select>
      </div>
      <div class="episode-list" id="episodeList"></div>
    </div>

    <!-- Cast -->
    <div class="d-section" id="castSection" style="display:none;">
      <div class="d-section-title">Top Cast</div>
      <div class="cast-row" id="castRow"></div>
    </div>

    <!-- Similar -->
    <div class="d-section" id="similarSection" style="display:none;">
      <div class="d-section-title">More Like This</div>
      <div class="similar-row" id="similarRow"></div>
    </div>

    <!-- Sources + Player -->
    <div class="d-section" id="sourcesSection">
      <div class="d-section-title">Stream Sources</div>
      <div class="source-tier-label">Core (verified)</div>
      <div class="source-tabs" id="sourceTabsCore"></div>
      <div class="source-tier-label">Extras (rotate frequently)</div>
      <div class="source-tabs" id="sourceTabsExtras"></div>
      <button class="retry-btn" id="retryBtn" style="margin-top:10px;">↻ Retry all sources</button>

      <div class="player-shell" style="margin-top:16px;">
        <video id="videoPlayer" controls playsinline crossorigin="anonymous"></video>
        <iframe id="embedFrame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
        <div class="player-status" id="playerStatus">Select a source above to start streaming</div>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  StreamVault · Multi-source streaming · <a href="#" id="resetKeyLink">Reset TMDB key</a>
</div>

<script>
(function(){
"use strict";

// ================= CONFIG =================
const TMDB_IMG="https://image.tmdb.org/t/p/w500";
const TMDB_PROFILE="https://image.tmdb.org/t/p/w185";
const TMDB_STILL="https://image.tmdb.org/t/p/w300";
const TMDB_BACKDROP="https://image.tmdb.org/t/p/original";
const TMDB_DEMO_KEY="8265bd1679663a7ea12ac168da84d2e8";

const TMDB_EMBED_API="https://tmdb-embed-api.vercel.app";
const VIDLINK_BASE="https://vidlink.pro/api";
const MOVIEBOX_API="https://moviebox-api.vercel.app";

// Provider registry: id, label, tier, url(tmdbId, mediaType, season, episode, imdbId)
const PROVIDERS = [
  // ---------- CORE (verified live at tmdb-embed-providers release) ----------
  {id:"vidsrcto", label:"VidSrc.to", tier:"core",
    url:(id,t,s,e)=> t==="movie" ? `https://vidsrc.to/embed/movie/${id}` : `https://vidsrc.to/embed/tv/${id}/${s}/${e}`},
  {id:"vidsrccc", label:"VidSrc.cc", tier:"core",
    url:(id,t,s,e)=> t==="movie" ? `https://vidsrc.cc/v2/embed/movie/${id}?poster=true&autoPlay=true` : `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}?poster=true&autoPlay=true`},
  {id:"vidfast", label:"VidFast", tier:"core",
    url:(id,t,s,e)=> t==="movie" ? `https://vidfast.pro/movie/${id}?autoPlay=true` : `https://vidfast.pro/tv/${id}/${s}/${e}?autoPlay=true`},
  {id:"vidlink", label:"Vidlink", tier:"core", direct:true},
  {id:"vidsrcpm", label:"VidSrc.pm", tier:"core",
    url:(id,t,s,e)=> t==="movie" ? `https://vidsrc.pm/embed/movie/${id}` : `https://vidsrc.pm/embed/tv/${id}/${s}/${e}`},
  {id:"2embedskin", label:"2Embed.skin", tier:"core",
    url:(id,t,s,e)=> t==="movie" ? `https://2embed.skin/embed/movie/${id}` : `https://2embed.skin/embed/tv/${id}/${s}/${e}`},
  {id:"2embed", label:"2Embed.cc", tier:"core",
    url:(id,t,s,e)=> t==="movie" ? `https://2embed.cc/embed/movie/${id}` : `https://2embed.cc/embed/tv/${id}/${s}/${e}`},

  // ---------- EXTRAS ----------
  {id:"autoembed", label:"AutoEmbed", tier:"extras",
    url:(id,t,s,e)=> t==="movie" ? `https://autoembed.co/embed/movie/${id}` : `https://autoembed.co/embed/tv/${id}/${s}/${e}`},
  {id:"multiembed", label:"MultiEmbed", tier:"extras",
    url:(id,t,s,e)=> t==="movie" ? `https://multiembed.mov/?video_id=${id}&tmdb=1` : `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}`},
  {id:"embedmaster", label:"EmbedMaster", tier:"extras",
    url:(id,t,s,e)=> t==="movie" ? `https://embedmaster.link/embed/movie/${id}` : `https://embedmaster.link/embed/tv/${id}/${s}/${e}`},
  {id:"vidsrcmov", label:"VidSrc.mov", tier:"extras",
    url:(id,t,s,e)=> t==="movie" ? `https://vidsrc.mov/embed/movie/${id}` : `https://vidsrc.mov/embed/tv/${id}/${s}/${e}`},
  {id:"vidsrcicu", label:"VidSrc.icu", tier:"extras",
    url:(id,t,s,e)=> t==="movie" ? `https://vidsrc.icu/embed/movie/${id}` : `https://vidsrc.icu/embed/tv/${id}/${s}/${e}`},
  {id:"smashystream", label:"SmashyStream", tier:"extras",
    url:(id,t,s,e)=> t==="movie" ? `https://player.smashy.stream/movie/${id}` : `https://player.smashy.stream/tv/${id}?s=${s}&e=${e}`},
  {id:"moviesapi", label:"MoviesAPI", tier:"extras",
    url:(id,t,s,e)=> t==="movie" ? `https://moviesapi.to/embed/movie/${id}` : `https://moviesapi.to/embed/tv/${id}/${s}/${e}`},
  {id:"nontongo", label:"Nontongo", tier:"extras",
    url:(id,t,s,e)=> t==="movie" ? `https://nontongo.win/embed/movie/${id}` : `https://nontongo.win/embed/tv/${id}/${s}/${e}`},
  {id:"frembed", label:"Frembed", tier:"extras",
    url:(id,t,s,e)=> t==="movie" ? `https://frembed.lat/api/film.php?id=${id}` : `https://frembed.lat/api/serie.php?id=${id}&sa=${s}&epi=${e}`},
  {id:"gomo", label:"Gomo.to", tier:"extras",
    url:(id,t,s,e)=> t==="movie" ? `https://gomo.to/movie/${id}` : `https://gomo.to/show/${id}/${s}-${e}`},
  {id:"embedsu", label:"Embed.su", tier:"extras",
    url:(id,t,s,e)=> t==="movie" ? `https://embed.su/embed/movie/${id}` : `https://embed.su/embed/tv/${id}/${s}/${e}`},

  // ---------- TMDB-Embed-API providers (direct HLS) ----------
  {id:"netmirror", label:"NetMirror", tier:"extras", api:"netmirror"},
  {id:"showbox", label:"Showbox", tier:"extras", api:"showbox"},
  {id:"streamflix", label:"StreamFlix", tier:"extras", api:"streamflix"},
  {id:"vixsrc", label:"VixSrc", tier:"extras", api:"vixsrc"},
  {id:"videasy", label:"Videasy", tier:"extras", api:"videasy"},

  // ---------- MovieBox ----------
  {id:"moviebox", label:"MovieBox", tier:"extras", api:"moviebox"},
];

const ALL_SOURCES = PROVIDERS.map(p=>p.id);
const DEFAULT_SOURCE = "vidsrcto";

// ================= UTILS =================
function esc(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML;}
function fmtRuntime(m){if(!m)return"";const h=Math.floor(m/60),x=m%60;return h>0?`${h}h ${x}m`:`${x}m`;}
function showStatus(msg,loading){
  playerStatus.innerHTML=loading?`<div class="spinner"></div>${esc(msg)}`:esc(msg);
  playerStatus.style.display="block"; videoPlayer.style.display="none"; embedFrame.style.display="none";
}
function hideStatus(){playerStatus.style.display="none";}
function destroyHls(){if(hls){try{hls.destroy();}catch(e){}hls=null;}videoPlayer.removeAttribute("src");videoPlayer.load();}
function initPlyr(){
  if(plyr)return;
  plyr=new Plyr(videoPlayer,{
    controls:["play-large","play","progress","current-time","duration","mute","volume","settings","pip","fullscreen"],
    settings:["quality","speed"],speed:{selected:1,options:[0.5,0.75,1,1.25,1.5,2]},
    keyboard:{focused:true,global:true},tooltips:{controls:true,seek:true},
    fullscreen:{enabled:true,fallback:true,iosNative:true},storage:{enabled:true,key:"plyr-sv"}
  });
}
function setTabState(container,src,state){
  const btn=container.querySelector(`button[data-source="${src}"]`);
  if(!btn)return;
  btn.classList.remove("loading","failed","active");
  if(state==="active")btn.classList.add("active");
  else if(state==="loading")btn.classList.add("loading");
  else if(state==="failed")btn.classList.add("failed");
}
function resetSourceTabs(){
  [sourceTabsCore,sourceTabsExtras].forEach(c=>c.querySelectorAll("button[data-source]").forEach(b=>b.classList.remove("loading","failed")));
  retryBtn.classList.remove("show");
}

// ================= TMDB =================
async function fetchTMDB(path,params={},retried=false){
  const key=localStorage.getItem("tmdb_key")||TMDB_DEMO_KEY;
  const url=new URL(`https://api.themoviedb.org/3${path}`);
  url.searchParams.set("api_key",key); url.searchParams.set("language","en-US");
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  let res;
  try{res=await fetch(url);}catch(e){throw new Error("Network error — check your connection.");}
  if(res.status===401){
    localStorage.removeItem("tmdb_key");
    if(retried)throw new Error("TMDB API key rejected.");
    const k=prompt("TMDB API key invalid.\nGet one: https://www.themoviedb.org/settings/api\n\nPaste key:");
    if(k&&k.trim()){localStorage.setItem("tmdb_key",k.trim());return fetchTMDB(path,params,true);}
    throw new Error("No API key.");
  }
  if(res.status===429){
    if(retried)throw new Error("TMDB rate limit. Wait 10s.");
    const k=prompt("Shared demo key rate-limited.\nPaste your own TMDB key (Cancel = retry demo):");
    if(k&&k.trim()){localStorage.setItem("tmdb_key",k.trim());return fetchTMDB(path,params,true);}
    await new Promise(r=>setTimeout(r,2000)); return fetchTMDB(path,params,true);
  }
  if(!res.ok)throw new Error(`TMDB error ${res.status}`);
  return res.json();
}

async function fetchFullDetail(id,mediaType){
  const type=mediaType==="tv"?"tv":"movie";
  const data=await fetchTMDB(`/${type}/${id}`,{append_to_response:"credits,external_ids,videos,similar"});
  return {...data,mediaType:type,title:data.title||data.name||"",
    year:(data.release_date||data.first_air_date||"").slice(0,4),
    imdb_id:data.imdb_id||data.external_ids?.imdb_id||null};
}

async function fetchSeason(tvId,seasonNum){return fetchTMDB(`/tv/${tvId}/season/${seasonNum}`);}

// ================= HOME =================
function createCard(item){
  const poster=item.poster_path?TMDB_IMG+item.poster_path:PLACEHOLDER_POSTER;
  const title=item.title||item.name||"Unknown";
  const year=(item.release_date||item.first_air_date||"").slice(0,4);
  const rating=item.vote_average?item.vote_average.toFixed(1):"N/A";
  const mt=item.media_type||"movie";
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`<img src="${poster}" alt="${esc(title)}" loading="lazy">
    <span class="quality-tag">${mt==="tv"?"TV":"HD"}</span>
    <div class="card-title">${esc(title)}</div>
    <div class="card-meta"><span>${year}</span><span>⭐ ${rating}</span></div>`;
  card.addEventListener("click",()=>openDetail({id:item.id,title,poster,year,rating,mediaType:mt,overview:item.overview||""}));
  return card;
}

function renderRow(title,items){
  const row=document.createElement("div"); row.className="row";
  row.innerHTML=`<h2>${title}</h2>`;
  const inner=document.createElement("div"); inner.className="row-inner";
  items.forEach(i=>inner.appendChild(createCard(i)));
  row.appendChild(inner); contentRows.appendChild(row);
}

async function loadHomepage(){
  contentRows.innerHTML='<div class="section-status"><div class="spinner"></div>Loading content…</div>';
  try{
    const [tr,np,pm,pt,topR,up]=await Promise.allSettled([
      fetchTMDB("/trending/all/week"),fetchTMDB("/movie/now_playing"),
      fetchTMDB("/movie/popular"),fetchTMDB("/tv/popular"),
      fetchTMDB("/movie/top_rated"),fetchTMDB("/movie/upcoming")
    ]);
    const v=r=>r.status==="fulfilled"?r.value:null;
    const t=v(tr),n=v(np),p=v(pm),tv=v(pt),top=v(topR),u=v(up);
    contentRows.innerHTML="";
    const trend=(t?.results||[]).filter(r=>r.media_type!=="person");
    if(trend.length)renderRow("🔥 Trending Now",trend.slice(0,18));
    if(n?.results)renderRow("🎥 In Theaters",n.results.slice(0,18));
    if(p?.results)renderRow("🎬 Popular Movies",p.results.slice(0,18));
    if(tv?.results)renderRow("📺 Popular TV Shows",tv.results.slice(0,18));
    if(top?.results)renderRow("🏆 Top Rated",top.results.slice(0,18));
    if(u?.results)renderRow("🎞 Coming Soon",u.results.slice(0,18));
    if(!t&&!n&&!p&&!tv&&!top&&!u){
      contentRows.innerHTML='<div class="section-status">⚠️ Could not load TMDB content.<br>Check the key from the footer.</div>'; return;
    }
    const hc=trend.find(x=>x.backdrop_path)||trend[0];
    if(hc)updateHero(hc);
  }catch(e){contentRows.innerHTML=`<div class="section-status">⚠️ ${esc(e.message)}</div>`;}
}

function updateHero(item){
  heroItem={id:item.id,title:item.title||item.name||"Unknown",
    poster:item.poster_path?TMDB_IMG+item.poster_path:"",
    year:(item.release_date||item.first_air_date||"").slice(0,4),
    rating:item.vote_average?item.vote_average.toFixed(1):"N/A",
    mediaType:item.media_type||"movie",overview:item.overview||""};
  heroTitle.textContent=heroItem.title;
  heroMeta.innerHTML=`<span class="match">${Math.round((item.vote_average||0)*10)}% Match</span>
    <span>${heroItem.year||"—"}</span>
    <span>${heroItem.mediaType==="tv"?"TV Series":"Movie"}</span>
    <span>⭐ ${heroItem.rating}</span>`;
  heroDesc.textContent=item.overview||"No description available.";
  if(item.backdrop_path)heroBg.style.backgroundImage=`url(${TMDB_BACKDROP}${item.backdrop_path})`;
}

// ================= SEARCH =================
async function performSearch(){
  const q=searchInput.value.trim(); if(!q){searchInput.focus();return;}
  searchBtn.disabled=true; searchBtn.textContent="…";
  contentRows.innerHTML='<div class="section-status"><div class="spinner"></div>Searching…</div>';
  try{
    const data=await fetchTMDB("/search/multi",{query:q,include_adult:"false"});
    const results=(data.results||[]).filter(r=>r.media_type==="movie"||r.media_type==="tv");
    contentRows.innerHTML="";
    if(!results.length){contentRows.innerHTML=`<div class="section-status">😕 No results for "${esc(q)}".</div>`;return;}
    const h=document.createElement("div"); h.className="search-header";
    h.innerHTML=`<h2>Results for "${esc(q)}"</h2><span class="count">${results.length} title${results.length===1?"":"s"}</span>`;
    contentRows.appendChild(h);
    const g=document.createElement("div"); g.className="search-grid";
    results.forEach(i=>g.appendChild(createCard(i))); contentRows.appendChild(g);
    const b=results.find(r=>r.backdrop_path); if(b)updateHero(b);
  }catch(e){contentRows.innerHTML=`<div class="section-status">⚠️ ${esc(e.message)}</div>`;}
  finally{searchBtn.disabled=false; searchBtn.textContent="Search";}
}

// ================= DETAIL OPEN =================
async function openDetail(partial){
  playSessionId++;
  detailModal.classList.add("open");
  detailModal.scrollTop=0;
  // Loading skeleton
  detailHero.style.backgroundImage="linear-gradient(135deg,#1a1a1a,#0a0a0a)";
  detailPoster.src=partial.poster||PLACEHOLDER_POSTER;
  detailTitle.textContent=partial.title||"Loading…";
  detailBadges.innerHTML=""; detailOverview.textContent="Loading details…";
  episodesSection.style.display="none"; castSection.style.display="none";
  similarSection.style.display="none";
  showStatus("Fetching title details…",true);

  try{
    const full=await fetchFullDetail(partial.id,partial.mediaType);
    const merged={...partial,...full,poster:full.poster_path?TMDB_IMG+full.poster_path:partial.poster};
    currentItem=merged;
    activeSeason=1; activeEpisode=1;
    renderDetail(merged);
    buildSourceTabs(merged);
    resetSourceTabs();
    playItem(merged,DEFAULT_SOURCE,[]);
  }catch(e){
    console.warn("Detail fetch failed:",e);
    detailOverview.textContent=partial.overview||"No description available.";
    currentItem=partial;
    buildSourceTabs(partial);
    playItem(partial,DEFAULT_SOURCE,[]);
  }
}

// ================= DETAIL RENDER =================
function renderDetail(item){
  const title=item.title||item.name||"Unknown";
  const year=(item.release_date||item.first_air_date||"").slice(0,4);
  const rating=item.vote_average?item.vote_average.toFixed(1):null;

  detailHero.style.backgroundImage=item.backdrop_path
    ?`url(${TMDB_BACKDROP}${item.backdrop_path})`
    :"linear-gradient(135deg,#1a1a1a,#0a0a0a)";
  detailPoster.src=item.poster_path?TMDB_IMG+item.poster_path:PLACEHOLDER_POSTER;
  detailPoster.alt=title;
  detailTitle.textContent=title;

  const badges=[];
  if(rating)badges.push(`<span class="rating">⭐ ${rating}</span>`);
  if(year)badges.push(`<span>${year}</span>`);
  if(item.runtime)badges.push(`<span>${fmtRuntime(item.runtime)}</span>`);
  if(item.mediaType==="tv"&&item.number_of_seasons)
    badges.push(`<span>${item.number_of_seasons} Season${item.number_of_seasons>1?"s":""}</span>`);
  if(item.mediaType==="tv"&&item.number_of_episodes)
    badges.push(`<span>${item.number_of_episodes} Episodes</span>`);
  if(Array.isArray(item.genres)&&item.genres.length)
    item.genres.slice(0,3).forEach(g=>badges.push(`<span class="pill">${esc(g.name)}</span>`));
  detailBadges.innerHTML=badges.join('<span class="divider">·</span>');
  detailOverview.textContent=item.overview||"No description available.";

  // Cast
  const cast=item.credits?.cast||[];
  if(cast.length){
    castSection.style.display="block";
    castRow.innerHTML=cast.slice(0,18).map(c=>`
      <div class="cast-card">
        ${c.profile_path?`<img src="${TMDB_PROFILE}${c.profile_path}" alt="${esc(c.name)}" loading="lazy">`:`<img src="${PLACEHOLDER_POSTER}" alt="">`}
        <div class="cast-name">${esc(c.name)}</div>
        <div class="cast-role">${esc(c.character||"")}</div>
      </div>`).join("");
  }else castSection.style.display="none";

  // Similar
  const sim=item.similar?.results||[];
  if(sim.length){
    similarSection.style.display="block";
    similarRow.innerHTML="";
    sim.slice(0,12).forEach(s=>{
      const poster=s.poster_path?TMDB_IMG+s.poster_path:PLACEHOLDER_POSTER;
      const d=document.createElement("div"); d.className="card"; d.style.flex="0 0 140px";
      d.innerHTML=`<img src="${poster}" alt="${esc(s.title||s.name||"")}" loading="lazy">
        <div class="card-title">${esc(s.title||s.name||"")}</div>`;
      d.addEventListener("click",()=>openDetail({id:s.id,title:s.title||s.name,poster,year:(s.release_date||s.first_air_date||"").slice(0,4),rating:s.vote_average?s.vote_average.toFixed(1):"N/A",mediaType:s.media_type||(item.mediaType==="tv"?"tv":"movie"),overview:s.overview||""}));
      similarRow.appendChild(d);
    });
  }else similarSection.style.display="none";

  // Episodes
  if(item.mediaType==="tv"&&Array.isArray(item.seasons)&&item.seasons.some(s=>s.season_number>0)){
    episodesSection.style.display="block";
    initSeasonUI(item);
  }else episodesSection.style.display="none";
}

function initSeasonUI(item){
  const seasons=item.seasons.filter(s=>s.season_number>0);
  seasonSelect.innerHTML=seasons.map(s=>`<option value="${s.season_number}">Season ${s.season_number}</option>`).join("");
  seasonSelect.value=String(activeSeason);
  loadSeasonEpisodes(item,activeSeason);
  seasonSelect.onchange=async()=>{
    activeSeason=parseInt(seasonSelect.value); activeEpisode=1;
    await loadSeasonEpisodes(item,activeSeason);
    playItem(currentItem,currentSource,[]);
  };
}

async function loadSeasonEpisodes(item,seasonNum){
  seasonLoading=true;
  episodeList.innerHTML='<div class="section-status" style="padding:20px 0;"><div class="spinner"></div>Loading episodes…</div>';
  try{
    const data=await fetchSeason(item.id,seasonNum);
    const eps=data.episodes||[];
    if(!eps.length){episodeList.innerHTML='<div class="section-status">No episodes.</div>';return;}
    episodeList.innerHTML=eps.map(e=>{
      const still=e.still_path?TMDB_STILL+e.still_path:PLACEHOLDER_STILL;
      return `<div class="episode-item ${e.episode_number===activeEpisode?"active":""}" data-ep="${e.episode_number}">
        <img class="episode-thumb" src="${still}" alt="" loading="lazy">
        <div class="episode-info">
          <div class="ep-title">E${e.episode_number} · ${esc(e.name||"Untitled")}</div>
          <div class="ep-meta">${e.air_date||""}${e.runtime?` · ${e.runtime}m`:""}</div>
          <div class="ep-overview">${esc(e.overview||"No synopsis.")}</div>
        </div>
        <div class="episode-num">${e.episode_number}</div>
      </div>`;
    }).join("");
    episodeList.querySelectorAll(".episode-item").forEach(el=>{
      el.addEventListener("click",()=>{
        activeEpisode=parseInt(el.dataset.ep);
        episodeList.querySelectorAll(".episode-item").forEach(x=>x.classList.remove("active"));
        el.classList.add("active");
        playItem(currentItem,currentSource,[]);
      });
    });
  }catch(e){episodeList.innerHTML='<div class="section-status">Failed to load episodes.</div>';}
  finally{seasonLoading=false;}
}

// ================= SOURCES =================
function buildSourceTabs(item){
  const core=PROVIDERS.filter(p=>p.tier==="core");
  const extras=PROVIDERS.filter(p=>p.tier==="extras");
  const render=(container,list)=>{
    container.innerHTML="";
    list.forEach(p=>{
      const b=document.createElement("button");
      b.dataset.source=p.id; b.textContent=p.label;
      if(p.id===currentSource)b.classList.add("active");
      container.appendChild(b);
    });
  };
  render(sourceTabsCore,core);
  render(sourceTabsExtras,extras);
}

function getProvider(id){return PROVIDERS.find(p=>p.id===id);}

function buildEmbedUrl(provider,item){
  if(provider.direct||provider.api)return null;
  return provider.url(item.id,item.mediaType,item.season||activeSeason,item.episode||activeEpisode);
}

// ================= DIRECT STREAM FETCHERS =================
async function fetchVidlink(item){
  const isMovie=item.mediaType==="movie";
  let u=`${VIDLINK_BASE}/vidlink/watch?isMovie=${isMovie}&id=${item.id}`;
  if(!isMovie)u+=`&season=${activeSeason}&episode=${activeEpisode}`;
  const r=await fetch(u); if(!r.ok)throw new Error(`Vidlink ${r.status}`);
  const d=await r.json(); const p=d?.stream?.playlist;
  if(!p)throw new Error("Vidlink no playlist"); return p;
}

async function fetchTMDBEmbedAPI(providerId,item){
  const type=item.mediaType==="movie"?"movie":"series";
  let u=`${TMDB_EMBED_API}/api/streams/${providerId}/${type}/${item.id}`;
  if(type==="series")u+=`?season=${activeSeason}&episode=${activeEpisode}`;
  const r=await fetch(u); if(!r.ok)throw new Error(`${providerId} ${r.status}`);
  const d=await r.json(); const streams=Array.isArray(d)?d:(d.streams||[]);
  if(!streams.length)throw new Error(`${providerId} no streams`);
  streams.sort((a,b)=>(parseInt(b.quality)||0)-(parseInt(a.quality)||0));
  return streams[0].url;
}

async function fetchMovieBox(item){
  const s=await fetch(`${MOVIEBOX_API}/search?q=${encodeURIComponent(item.title)}`);
  if(!s.ok)throw new Error("MovieBox search failed");
  const sd=await s.json(); const res=sd.results||sd.data||[];
  if(!res.length)throw new Error("MovieBox no results");
  const m=res[0]; const slug=m.slug||m.id;
  const d=await fetch(`${MOVIEBOX_API}/detail/${slug}`);
  if(!d.ok)throw new Error("MovieBox detail failed");
  const dd=await d.json(); const sid=dd.id||m.id;
  const st=await fetch(`${MOVIEBOX_API}/api/stream/${sid}?detail_path=${slug}`);
  if(!st.ok)throw new Error("MovieBox stream failed");
  const std=await st.json();
  const u=std.url||std.stream||(std.sources&&std.sources[0]?.file);
  if(!u)throw new Error("MovieBox no URL"); return u;
}

async function getDirectStream(provider,item){
  if(provider.id==="vidlink")return fetchVidlink(item);
  if(provider.id==="moviebox")return fetchMovieBox(item);
  if(provider.api)return fetchTMDBEmbedAPI(provider.api,item);
  throw new Error("Not a direct source");
}

// ================= PLAYBACK =================
function playStreamUrl(url,onErr){
  destroyHls();
  if(!url){onErr?onErr(new Error("Empty URL")):showStatus("No stream URL.",false);return;}
  const isHls=url.includes(".m3u8")||url.includes("m3u8");
  if(isHls){
    if(Hls.isSupported()){
      hls=new Hls({maxBufferLength:30,maxMaxBufferLength:60});
      hls.loadSource(url); hls.attachMedia(videoPlayer);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{
        hideStatus(); videoPlayer.style.display="block"; embedFrame.style.display="none";
        initPlyr(); videoPlayer.play().catch(()=>{});
      });
      hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)onErr?onErr(new Error(`HLS: ${d.details}`)):showStatus(`HLS: ${d.details}`,false);});
      return;
    }
    if(videoPlayer.canPlayType("application/vnd.apple.mpegurl")){
      videoPlayer.src=url; hideStatus(); videoPlayer.style.display="block"; embedFrame.style.display="none";
      initPlyr(); videoPlayer.play().catch(()=>{}); return;
    }
    onErr?onErr(new Error("HLS unsupported")):showStatus("HLS unsupported.",false); return;
  }
  videoPlayer.src=url; hideStatus(); videoPlayer.style.display="block"; embedFrame.style.display="none";
  initPlyr(); videoPlayer.play().catch(()=>{});
}

function playEmbedUrl(url){
  destroyHls(); if(plyr){try{plyr.pause();}catch(e){}}
  hideStatus(); videoPlayer.style.display="none"; embedFrame.style.display="block";
  embedFrame.src=url;
}

async function playItem(item,source,attempted=[]){
  const session=++playSessionId;
  if(attempted.includes(source)){
    const rem=ALL_SOURCES.filter(s=>!attempted.includes(s));
    if(!rem.length){
      showStatus("All sources failed. Pick one manually or retry.",false);
      retryBtn.classList.add("show"); return;
    }
    source=rem[0];
  }
  currentItem=item; currentSource=source;
  const provider=getProvider(source);
  if(!provider){showStatus("Unknown source.",false);return;}

  if(attempted.length===0)resetSourceTabs();
  const tabContainer=provider.tier==="core"?sourceTabsCore:sourceTabsExtras;
  setTabState(tabContainer,source,"loading");
  [sourceTabsCore,sourceTabsExtras].forEach(c=>c.querySelectorAll("button[data-source]").forEach(b=>b.classList.remove("active")));
  tabContainer.querySelector(`button[data-source="${source}"]`)?.classList.add("active");

  // Embed provider
  if(!provider.direct&&!provider.api){
    const url=buildEmbedUrl(provider,item);
    if(!url){
      setTabState(tabContainer,source,"failed");
      const na=[...attempted,source]; const rem=ALL_SOURCES.filter(s=>!na.includes(s));
      if(!rem.length){showStatus("All sources failed.",false);retryBtn.classList.add("show");return;}
      showStatus(`${provider.label} produced no URL. Trying ${rem[0]}…`,true);
      setTimeout(()=>playItem(item,rem[0],na),1200); return;
    }
    setTabState(tabContainer,source,"active");
    playEmbedUrl(url); return;
  }

  // Direct stream
  showStatus(`Loading ${provider.label}…`,true);
  try{
    const url=await getDirectStream(provider,item);
    if(session!==playSessionId)return;
    setTabState(tabContainer,source,"active");
    playStreamUrl(url,(err)=>{
      if(session!==playSessionId)return;
      console.warn(`${provider.label} playback failed:`,err);
      setTabState(tabContainer,source,"failed");
      const na=[...attempted,source]; const rem=ALL_SOURCES.filter(s=>!na.includes(s));
      if(!rem.length){showStatus("All sources failed to play.",false);retryBtn.classList.add("show");return;}
      showStatus(`${provider.label} failed. Trying ${rem[0]}…`,true);
      setTimeout(()=>playItem(item,rem[0],na),1800);
    });
  }catch(e){
    if(session!==playSessionId)return;
    console.warn(`${provider.label} fetch failed:`,e);
    setTabState(tabContainer,source,"failed");
    const na=[...attempted,source]; const rem=ALL_SOURCES.filter(s=>!na.includes(s));
    if(!rem.length){showStatus(`All failed. Last: ${e.message}`,false);retryBtn.classList.add("show");return;}
    showStatus(`${provider.label} failed. Trying ${rem[0]}…`,true);
    setTimeout(()=>playItem(item,rem[0],na),1800);
  }
}

// ================= EVENTS =================
searchBtn.addEventListener("click",performSearch);
searchInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();performSearch();}});

[sourceTabsCore,sourceTabsExtras].forEach(container=>{
  container.addEventListener("click",e=>{
    const btn=e.target.closest("button[data-source]");
    if(!btn||!currentItem)return;
    playItem(currentItem,btn.dataset.source,[]);
  });
});
retryBtn.addEventListener("click",()=>{
  if(!currentItem)return;
  resetSourceTabs();
  playItem(currentItem,DEFAULT_SOURCE,[]);
});

function closeDetail(){
  playSessionId++;
  detailModal.classList.remove("open");
  destroyHls(); embedFrame.src="about:blank"; embedFrame.style.display="none";
  if(plyr)plyr.pause();
}
detailClose.addEventListener("click",closeDetail);
detailModal.addEventListener("click",e=>{if(e.target===detailModal)closeDetail();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&detailModal.classList.contains("open"))closeDetail();});

pillNav.addEventListener("click",e=>{
  const btn=e.target.closest("button[data-tab]"); if(!btn)return;
  pillNav.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  const tab=btn.dataset.tab;
  if(tab==="episodes")episodesSection.style.display=episodesSection.style.display==="none"?"block":"block";
  if(tab==="cast")castSection.scrollIntoView({behavior:"smooth"});
  if(tab==="similar")similarSection.scrollIntoView({behavior:"smooth"});
  if(tab==="sources")sourcesSection.scrollIntoView({behavior:"smooth"});
});

heroPlayBtn.addEventListener("click",()=>{if(heroItem)openDetail(heroItem);});
heroInfoBtn.addEventListener("click",()=>{if(heroItem)openDetail(heroItem);});
detailPlayBtn.addEventListener("click",()=>{if(currentItem)playItem(currentItem,currentSource,[]);});
detailInfoBtn.addEventListener("click",()=>{if(currentItem)playItem(currentItem,currentSource,[]);});

window.addEventListener("scroll",()=>{navbar.classList.toggle("scrolled",window.scrollY>50);});
window.addEventListener("beforeunload",()=>{destroyHls();if(plyr)plyr.destroy();});
document.getElementById("resetKeyLink").addEventListener("click",e=>{
  e.preventDefault(); localStorage.removeItem("tmdb_key");
  alert("TMDB key cleared. Reload and enter a new key on next API call.");
});

// ================= INIT =================
document.addEventListener("DOMContentLoaded",()=>{initPlyr();loadHomepage();});
})();
</script>
</body>
</html>
